apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-config
  labels:
    app: url-shortener
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_CAPACITY: "10"
  RATE_LIMIT_REFILL_RATE: "2.0"
  RATE_LIMIT_STRATEGY: "token_bucket"
  CACHE_TTL_SECONDS: "86400"
  CLICK_BATCH_SIZE: "100"
  CLICK_FLUSH_INTERVAL: "1.0"
  REDIS_NODES: "redis://redis-0.redis:6379/0,redis://redis-1.redis:6379/0"
