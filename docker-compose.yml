version: "3.8"

services:
  # Primary PostgreSQL Persistence
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: url_shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Redis Shard 1 (Consistent Hashing node 1)
  redis1:
    image: redis:7-alpine
    container_name: url_shortener_redis1
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # Redis Shard 2 (Consistent Hashing node 2)
  redis2:
    image: redis:7-alpine
    container_name: url_shortener_redis2
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # FastAPI Application Node 1 (Snowflake Worker ID 1)
  api1:
    build: .
    container_name: url_shortener_api1
    restart: always
    environment:
      WORKER_ID: 1
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/url_shortener
      REDIS_URL: redis://redis1:6379/0
      REDIS_NODES: redis://redis1:6379/0,redis://redis2:6379/0
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy
    networks:
      - app_network

  # FastAPI Application Node 2 (Snowflake Worker ID 2)
  api2:
    build: .
    container_name: url_shortener_api2
    restart: always
    environment:
      WORKER_ID: 2
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/url_shortener
      REDIS_URL: redis://redis1:6379/0
      REDIS_NODES: redis://redis1:6379/0,redis://redis2:6379/0
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis1:
        condition: service_healthy
      redis2:
        condition: service_healthy
    networks:
      - app_network

  # Background Asynchronous Click Aggregation Worker
  click-worker:
    build: .
    container_name: url_shortener_click_worker
    command: ["python", "scripts/click_worker.py"]
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/url_shortener
      REDIS_URL: redis://redis1:6379/0
      CLICK_FLUSH_INTERVAL: 1.0
      CLICK_BATCH_SIZE: 100
    depends_on:
      postgres:
        condition: service_healthy
      redis1:
        condition: service_healthy
    networks:
      - app_network

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: url_shortener_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - app_network

  # Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: url_shortener_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api1
      - api2
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
